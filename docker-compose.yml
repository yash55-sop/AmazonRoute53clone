services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/route53.db}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-route53_session}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_LIFETIME_SECONDS: "${SESSION_LIFETIME_SECONDS:-86400}"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - route53_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  route53_data:
